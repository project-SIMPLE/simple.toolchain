name: "[GAMA Plugin] Java CI with Maven"

on:
  push:
    paths:
    - 'GAMA Plugin/**'
  pull_request:
    paths:
    - 'GAMA Plugin/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        sparse-checkout: "GAMA Plugin"
        
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'adopt'
        java-version: 21

    - name: Build with Maven
      run: mvn verify
      working-directory: "GAMA Plugin/eu.project-simple.parent"
